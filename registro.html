<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Setor de Provas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">P</div>
      <h1 class="login-title">Criar conta</h1>
      <p class="login-subtitle">Setor de Provas</p>
    </div>

    <div id="registro-alert" style="display: none; padding: 0.85rem; margin-bottom: 1.25rem; border-radius: var(--radius-md); font-size: 0.88rem; background-color: var(--danger-light); color: var(--danger-text); border: 1px solid var(--danger-border);"></div>

    <form id="form-registro">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control" required autocomplete="name">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="senha" class="form-label">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="senha" class="form-control" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="codigo" class="form-label">Código de administrador (opcional)</label>
        <input type="password" id="codigo" class="form-control" autocomplete="off">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 1rem;">
        <span>Criar conta</span>
      </button>
    </form>

    <div style="margin-top: 1rem; text-align: center; font-size: 0.88rem;">
      Já tem conta? <a href="login.html" style="color: var(--primary); font-weight: 600;">Entrar</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const alerta = document.getElementById('registro-alert');
      alerta.style.display = 'none';
      btn.disabled = true;

      try {
        await Auth.registrar(
          document.getElementById('nome').value.trim(),
          document.getElementById('email').value.trim(),
          document.getElementById('senha').value,
          document.getElementById('codigo').value
        );
        window.location.href = 'dashboard.html';
      } catch (error) {
        alerta.textContent = error.message || 'Não foi possível criar a conta.';
        alerta.style.display = 'block';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
